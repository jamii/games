<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Board</title>
  <style>
    @page {
      size: Letter landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .page {
      width: 279.4mm;
      height: 215.9mm;
      margin: 0 auto;
      padding: 5mm;
      background: white;
    }

    svg {
      display: block;
      width: 269.400mm;
      height: 205.900mm;
    }

    .cell polygon {
      stroke: #111;
      stroke-width: 0.22;
    }

    .empty polygon {
      fill: white;
    }

    .home polygon {
      fill: #dcecff;
    }

    .flag polygon {
      fill: #fff0a8;
    }

    text {
      font-family: Arial, Helvetica, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .cell-label {
      font-size: 9.367px;
      font-weight: 800;
      fill: #111;
    }

    .slot {
      stroke: #555;
      stroke-width: 0.25;
      stroke-dasharray: 1.6 1.2;
    }

    .slot.letters {
      fill: #fdeaea;
    }

    .slot.numbers {
      fill: #e9eefa;
    }

    .slot-label {
      font-size: 5px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .slot-label.letters {
      fill: #8b2222;
    }

    .slot-label.numbers {
      fill: #1f3e7a;
    }

    @media screen {
      .page {
        margin: 8mm auto;
        box-shadow: 0 0 8mm rgba(0, 0, 0, 0.25);
      }
    }

    @media print {
      body {
        background: white;
      }
    }
  </style>
</head>
