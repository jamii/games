[package]
name = "game-001-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "The game and the bot compiled to WebAssembly, for the single-player page (see README.md)."

[lib]
crate-type = ["cdylib"]

[dependencies]
game-001 = { path = "..", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
