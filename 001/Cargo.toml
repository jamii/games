[package]
name = "game-001"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "game-001"

[features]
default = ["server"]
# The web server (src/main.rs). The browser build (web/) leaves it out.
server = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde", "union"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"], optional = true }

# Seeds games that don't name a seed. Browsers have no operating system to
# ask, so the browser build always passes seeds instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"

[[bin]]
name = "game-001"
path = "src/main.rs"
required-features = ["server"]
