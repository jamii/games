[package]
name = "game-001"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "game-001"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde", "union"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
