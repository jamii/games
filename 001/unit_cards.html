<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unit cards</title>
  <style>
    @page {
      size: Letter portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .page {
      width: 215.9mm;
      height: 279.4mm;
      padding: 5mm;
      margin: 0 auto;
      background: white;
      display: grid;
      grid-template-columns: repeat(5, 33.800mm);
      grid-auto-rows: 29.272mm;
      gap: 2mm;
      justify-content: center;
      align-content: center;
      break-after: page;
      page-break-after: always;
    }

    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    .unit {
      width: 33.800mm;
      height: 29.272mm;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cut-line {
      stroke: #111;
      stroke-width: 0.22;
    }

    .cut-line.blank {
      fill: white;
    }

    .cut-line.letters {
      fill: #fdeaea;
    }

    .cut-line.numbers {
      fill: #e9eefa;
    }

    .arrow {
      fill: none;
      stroke: #111;
      stroke-width: 0.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .unit-label {
      font-size: 11.492px;
      font-weight: 800;
      font-family: Arial, Helvetica, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #111;
    }

    @media screen {
      .page {
        margin: 8mm auto;
        box-shadow: 0 0 8mm rgba(0, 0, 0, 0.25);
      }
    }

    @media print {
      body {
        background: white;
      }
    }
  </style>
</head>
