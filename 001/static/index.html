<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>001</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <section id="seat-top" class="seat"></section>
    <section id="market"></section>
    <main id="table">
      <div id="ticker" data-act="log" title="What just happened (tap for the log)" aria-live="polite"></div>
      <div id="board-wrap">
        <svg id="board" aria-label="Game board"></svg>
        <div id="neutral"></div>
        <div id="banner" hidden></div>
      </div>
    </main>
    <section id="sheet">
      <div id="inspector" class="panel"></div>
    </section>
    <section id="seat-bottom" class="seat"></section>
    <section id="hand"></section>
    <aside id="log-wrap" class="panel">
      <div class="panel-title">Log <button class="mini close-log" data-act="log" title="Close the log">✕</button></div>
      <div id="log"></div>
      <form id="chat">
        <input id="chat-input" placeholder="Say something…" autocomplete="off" maxlength="500">
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>
  <div id="preview" hidden></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
